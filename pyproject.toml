[project]
name = "kronos-invest"
version = "0.1.0"
description = "Lookahead-safe evaluation of the Kronos-base foundation model as a zero-shot signal for long-only equity portfolios"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "pyyaml>=6",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
infer = ["torch>=2.0", "huggingface_hub>=0.23", "einops", "safetensors", "tqdm"]
dev = ["pytest>=7"]
viz = ["quantstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
packages = ["common", "infer", "backtest", "backtest.strategies", "data_prepare"]
